services:
  # ============================================================
  # 1. PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: portfolioiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolioiq}
      POSTGRES_USER: ${POSTGRES_USER:-portfolioiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolioiq_pass_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolioiq_user} -d ${POSTGRES_DB:-portfolioiq}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - portfolioiq_net

  # ============================================================
  # 2. Backend REST API & Quantitative Engine
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolioiq_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolioiq_user}:${POSTGRES_PASSWORD:-portfolioiq_pass_change_me}@postgres:5432/${POSTGRES_DB:-portfolioiq}
      PORTFOLIOIQ_API_KEY: ${PORTFOLIOIQ_API_KEY:-dev-api-key}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      DRY_RUN_MODE: ${DRY_RUN_MODE:-false}
      RUN_INLINE_SCHEDULER: ${RUN_INLINE_SCHEDULER:-true}
      ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5000,http://127.0.0.1:5000,http://localhost:3000,https://portfolioiq-4lph7.netlify.app,*"
      FRONTEND_ORIGIN: "http://localhost:8080"
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - portfolioiq_net

  # ============================================================
  # 3. Frontend Dashboard UI (Nginx)
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: portfolioiq_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portfolioiq_net

  # ============================================================
  # 4. pgAdmin (Optional Database GUI)
  # Access at http://localhost:5050 via:
  # docker compose --profile tools up -d
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: portfolioiq_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@portfolioiq.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_change_me
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools
    networks:
      - portfolioiq_net

networks:
  portfolioiq_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local
