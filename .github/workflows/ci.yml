name: PortfolioIQ CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Scan repository history for secrets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lint-and-audit:
    runs-on: ubuntu-latest
    name: Lint code and audit dependencies
    needs: secret-scan
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check code formatting with Ruff
        run: ruff format --check .

      - name: Lint codebase with Ruff
        run: ruff check .

      - name: Audit dependencies for vulnerabilities
        run: |
          pip-audit -r requirements.txt --desc \
            --ignore-vuln PYSEC-2020-25 \
            --ignore-vuln CVE-2026-77528

  docker-build:
    runs-on: ubuntu-latest
    name: Validate Docker container build
    needs: secret-scan
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t portfolioiq:ci .

  test:
    runs-on: ubuntu-latest
    name: Run tests and migration checks
    needs: [secret-scan, lint-and-audit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolioiq_user
          POSTGRES_PASSWORD: portfolioiq_pass_change_me
          POSTGRES_DB: portfolioiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolioiq_user -d portfolioiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for PostgreSQL connection
        run: |
          python -c "
          import time, psycopg2
          dsn = 'postgresql://portfolioiq_user:portfolioiq_pass_change_me@127.0.0.1:5432/portfolioiq'
          for i in range(30):
              try:
                  conn = psycopg2.connect(dsn, connect_timeout=2)
                  conn.close()
                  print('PostgreSQL is ready and accepting connections!')
                  break
              except Exception as e:
                  print(f'Waiting for PostgreSQL ({i+1}/30): {e}')
                  time.sleep(1)
          else:
              raise SystemExit('PostgreSQL connection timed out after 30 seconds')
          "

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://portfolioiq_user:portfolioiq_pass_change_me@127.0.0.1:5432/portfolioiq
          KITE_API_KEY: test_key
          KITE_API_SECRET: test_secret
          DRY_RUN_MODE: "true"
          CI: "true"
        run: python db/run_migrations.py

      - name: Run test suite with coverage
        env:
          DATABASE_URL: postgresql://portfolioiq_user:portfolioiq_pass_change_me@127.0.0.1:5432/portfolioiq
          KITE_API_KEY: test_key
          KITE_API_SECRET: test_secret
          DRY_RUN_MODE: "true"
          CI: "true"
        run: pytest tests/ --cov=src --cov-fail-under=75 --cov-report=json:coverage.json -v --tb=short

      - name: Verify safety-critical test coverage
        run: python scripts/check_critical_coverage.py

  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend API (Render / Railway)
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python 3.12 for smoke test
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Determine deployment target
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_URL: ${{ secrets.RENDER_APP_URL }}
          RAILWAY_TOK: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_URL: ${{ secrets.RAILWAY_APP_URL }}
          GENERIC_URL: ${{ secrets.API_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "DEPLOY_TARGET=render" >> $GITHUB_ENV
            echo "Deployment target: Render (Deploy Hook)"
          elif [ -n "$RAILWAY_TOK" ]; then
            echo "DEPLOY_TARGET=railway" >> $GITHUB_ENV
            echo "Deployment target: Railway (CLI)"
          else
            echo "DEPLOY_TARGET=none" >> $GITHUB_ENV
            echo "::warning::Neither RENDER_DEPLOY_HOOK_URL nor RAILWAY_TOKEN configured — skipping backend deployment"
          fi

          TARGET_URL="${RENDER_URL:-${RAILWAY_URL:-$GENERIC_URL}}"
          if [ -n "$TARGET_URL" ]; then
            echo "SMOKE_TEST_URL=$TARGET_URL" >> $GITHUB_ENV
            echo "Smoke test target: $TARGET_URL"
          else
            echo "::warning::No API URL configured for smoke test (RENDER_APP_URL, RAILWAY_APP_URL, or API_URL)"
          fi

      - name: Deploy to Render via Deploy Hook
        if: env.DEPLOY_TARGET == 'render'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment via deploy hook..."
          HTTP_STATUS=$(curl -s -o render_response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment triggered successfully! (HTTP $HTTP_STATUS)"
            cat render_response.txt
          else
            echo "Render deploy hook returned unexpected status: HTTP $HTTP_STATUS"
            cat render_response.txt || true
            exit 1
          fi

      - name: Deploy to Railway via CLI
        if: env.DEPLOY_TARGET == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying to Railway..."
          npm install -g @railway/cli
          railway up --detach

      - name: Run post-deployment smoke test
        if: env.DEPLOY_TARGET != 'none' && env.SMOKE_TEST_URL != ''
        id: smoke-test
        run: |
          python scripts/smoke_test.py --base-url "$SMOKE_TEST_URL" --timeout 120

      - name: Rollback Railway deployment on smoke test failure
        if: failure() && steps.smoke-test.outcome == 'failure' && env.DEPLOY_TARGET == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Smoke test failed! Rolling back Railway to previous commit (HEAD~1)..."
          git checkout HEAD~1
          railway up --detach
          echo "Rollback triggered. Failing CI to alert the team."
          exit 1

  deploy-netlify:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Netlify
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Check Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Netlify secrets not configured — skipping frontend deployment"
            echo "SKIP_NETLIFY=true" >> $GITHUB_ENV
          fi

      - name: Deploy to Netlify
        if: env.SKIP_NETLIFY != 'true'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './frontend'
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
