name: PortfolioIQ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Scan repository history for secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lint-and-audit:
    runs-on: ubuntu-latest
    name: Lint code and audit dependencies
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check code formatting with Ruff
        run: ruff format --check .

      - name: Lint codebase with Ruff
        run: ruff check .

      - name: Audit dependencies for vulnerabilities
        run: |
          pip-audit -r requirements.txt --desc \
            --ignore-vuln PYSEC-2020-25 \
            --ignore-vuln CVE-2026-77528

  docker-build:
    runs-on: ubuntu-latest
    name: Validate Docker container build
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t portfolioiq:ci .

  test:
    runs-on: ubuntu-latest
    name: Run tests and migration checks
    needs: [secret-scan, lint-and-audit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolioiq_user
          POSTGRES_PASSWORD: portfolioiq_pass_change_me
          POSTGRES_DB: portfolioiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolioiq_user -d portfolioiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for PostgreSQL connection
        run: |
          python -c "
          import time, psycopg2
          dsn = 'postgresql://portfolioiq_user:portfolioiq_pass_change_me@127.0.0.1:5432/portfolioiq'
          for i in range(30):
              try:
                  conn = psycopg2.connect(dsn, connect_timeout=2)
                  conn.close()
                  print('PostgreSQL is ready and accepting connections!')
                  break
              except Exception as e:
                  print(f'Waiting for PostgreSQL ({i+1}/30): {e}')
                  time.sleep(1)
          else:
              raise SystemExit('PostgreSQL connection timed out after 30 seconds')
          "

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://portfolioiq_user:portfolioiq_pass_change_me@127.0.0.1:5432/portfolioiq
          KITE_API_KEY: test_key
          KITE_API_SECRET: test_secret
          DRY_RUN_MODE: "true"
          CI: "true"
        run: python db/run_migrations.py

      - name: Run test suite with coverage
        env:
          DATABASE_URL: postgresql://portfolioiq_user:portfolioiq_pass_change_me@127.0.0.1:5432/portfolioiq
          KITE_API_KEY: test_key
          KITE_API_SECRET: test_secret
          DRY_RUN_MODE: "true"
          CI: "true"
        run: pytest tests/ --cov=src --cov-fail-under=75 --cov-report=json:coverage.json -v --tb=short

      - name: Verify safety-critical test coverage
        run: python scripts/check_critical_coverage.py

  deploy-pages:
    runs-on: ubuntu-latest
    name: Publish static GitHub Pages preview
    needs: [test, docker-build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend files
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
