name: PortfolioIQ CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Scan repository history for secrets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lint-and-audit:
    runs-on: ubuntu-latest
    name: Lint code and audit dependencies
    needs: secret-scan
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check code formatting with Ruff
        run: ruff format --check .

      - name: Lint codebase with Ruff
        run: ruff check .

      - name: Audit dependencies for vulnerabilities
        run: pip-audit -r requirements.txt --desc

  docker-build:
    runs-on: ubuntu-latest
    name: Validate Docker container build
    needs: secret-scan
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t portfolioiq:ci .

  test:
    runs-on: ubuntu-latest
    name: Run tests and migration checks
    needs: [secret-scan, lint-and-audit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolioiq_user
          POSTGRES_PASSWORD: portfolioiq_pass_change_me
          POSTGRES_DB: portfolioiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolioiq_user -d portfolioiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://portfolioiq_user:portfolioiq_pass_change_me@localhost:5432/portfolioiq
          KITE_API_KEY: test_key
          KITE_API_SECRET: test_secret
          DRY_RUN_MODE: "true"
          CI: "true"
        run: python db/run_migrations.py

      - name: Run test suite with coverage
        env:
          DATABASE_URL: postgresql://portfolioiq_user:portfolioiq_pass_change_me@localhost:5432/portfolioiq
          KITE_API_KEY: test_key
          KITE_API_SECRET: test_secret
          DRY_RUN_MODE: "true"
          CI: "true"
        run: pytest tests/ --cov=src --cov-fail-under=75 --cov-report=json:coverage.json -v --tb=short

      - name: Verify safety-critical test coverage
        run: python scripts/check_critical_coverage.py

  deploy-railway:
    runs-on: ubuntu-latest
    name: Deploy API to Railway
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python 3.12 for smoke test
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --detach

      - name: Run post-deployment smoke test
        id: smoke-test
        run: |
          python scripts/smoke_test.py --base-url "${{ secrets.RAILWAY_APP_URL }}" --timeout 60

      - name: Rollback Railway deployment on smoke test failure
        if: failure() && steps.smoke-test.outcome == 'failure'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Smoke test failed! Rolling back Railway to previous commit (HEAD~1)..."
          git checkout HEAD~1
          railway up --detach
          echo "Rollback triggered. Failing CI to alert the team."
          exit 1

  deploy-netlify:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Netlify
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './frontend'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
