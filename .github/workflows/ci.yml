name: PortfolioIQ CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Scan repository history for secrets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  test:
    runs-on: ubuntu-latest
    name: Run tests and migration checks
    needs: secret-scan
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolioiq_user
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: portfolioiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolioiq_user -d portfolioiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ flask_app.py

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://portfolioiq_user@localhost:5432/portfolioiq
          KITE_API_KEY: test_key
          KITE_API_SECRET: test_secret
          DRY_RUN_MODE: "true"
        run: python db/run_migrations.py
      - name: Run tests
        env:
          DATABASE_URL: postgresql://portfolioiq_user@localhost:5432/portfolioiq
          KITE_API_KEY: test_key
          KITE_API_SECRET: test_secret
          DRY_RUN_MODE: "true"
        run: pytest tests/ -v --tb=short

  deploy-railway:
    runs-on: ubuntu-latest
    name: Deploy API to Railway
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --detach

  deploy-netlify:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Netlify
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './frontend'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
