[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by ruff format
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    # Prototype modules scheduled for future roadmap phases:
    "src/analytics/*",           # Phase 4: Trading Intelligence & Risk
    "src/ingestion/kite_auth.py",# Phase 3: Data Quality & Market Infrastructure
    "src/ingestion/kite_sync.py",# Phase 3: Data Quality & Market Infrastructure
    "src/ingestion/yahoo_poller.py", # Phase 3: Data Quality & Market Infrastructure
    "src/ingestion/instrument_mapper.py", # Phase 3: Data Quality & Market Infrastructure
    "src/export/*",              # Phase 5: Automated Operations & Observability
    "src/scheduler/*",           # Phase 5: Automated Operations & Observability
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
