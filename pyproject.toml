[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by ruff format
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    # Legacy prototype / deprecated files replaced in earlier phases:
    "src/analytics/predictor.py",          # Replaced by evidence-based indicators in Phase 5
    "src/analytics/corporate_actions.py",   # Replaced by database reconciliation in Phase 3
    "src/ingestion/yahoo_poller.py",       # Replaced by kite_quote_poller in Phase 3
    "src/ingestion/instrument_mapper.py",  # Replaced by ticker_map in Phase 3
    "src/ingestion/kite_auth.py",          # Interactive OAuth helper
    "src/export/*",                        # Prototype exporter modules
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
